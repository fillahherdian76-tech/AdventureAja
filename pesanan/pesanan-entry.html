<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/AdventureAja.png" />
    <title>AdventureAja | Tambah Pesanan</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/crud.css" />
  </head>
  <body>
    <div class="page">
      <!-- NAVBAR -->
      <header class="navbar">
        <div class="logo">
          <img src="../assets/AdventureAja.png" alt="AdventureAja" class="logo-img" />
        </div>
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-btn">&#9776;</label>
        <nav>
          <a href="../dashboard.html">Home</a>
          <a href="../katalog/katalog.html">Katalog</a>
          <a href="pesanan.html" class="active">Pesanan</a>
          <a href="#">Profil</a>
          <a href="#" class="profile-icon" aria-label="Akun">&#128100;</a>
        </nav>
      </header>

      <main>
        <section class="section">
          <div class="form-card">
            <h2>Tambah Pesanan</h2>

            <form action="pesanan.html" method="post">
              <label for="barang">Nama Barang</label>
              <input type="text" id="barang" name="barang" placeholder="Contoh: Tenda 3 Layer" />

              <label for="tgl-mulai">Tanggal Mulai Sewa</label>
              <input type="date" id="tgl-mulai" name="tgl_mulai" />

              <label for="tgl-selesai">Tanggal Selesai Sewa</label>
              <input type="date" id="tgl-selesai" name="tgl_selesai" />

              <label for="lokasi">Lokasi</label>
              <input type="text" id="lokasi" name="lokasi" placeholder="Contoh: Jl. Kemantren 1 Malang" />

              <label for="total">Total Harga</label>
              <input type="number" id="total" name="total" placeholder="Contoh: 150000" />

              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="diterima">Pesanan Diterima</option>
                <option value="diproses">Diproses</option>
                <option value="disewa">Sedang Disewa</option>
                <option value="selesai">Selesai</option>
              </select>

              <div class="form-actions">
                <a href="pesanan.html" class="btn-cancel">Batal</a>
                <button type="submit" class="btn-primary">Simpan</button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <footer>
        <p>&copy; AdventureAja 2026</p>
      </footer>
    </div>
  </body>
</html>
