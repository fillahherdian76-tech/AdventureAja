
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AdventureAja | Katalog</title>

    <link rel="icon" href="../assets/AdventureAja.png">

    <!-- Boxicons -->
    <link
        href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css"
        rel="stylesheet"
    >

    <!-- CSS Dashboard -->
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="page">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo-details">
                <span class="logo_name">
                    Adventure<span class="logo-accent">Aja</span>
                </span>

                <i class="bx bx-menu toggle-btn" id="sidebarToggle"></i>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="../dashboard.html">
                        <i class="bx bxs-home"></i>
                        <span class="link-text">Home</span>
                    </a>
                </li>

                <li>
                    <a href="katalog.html" class="active">
                        <i class="bx bxs-box"></i>
                        <span class="link-text">Katalog</span>
                    </a>
                </li>

                <li>
                    <a href="../pesanan/pesanan.html">
                        <i class="bx bxs-receipt"></i>
                        <span class="link-text">Pesanan</span>
                    </a>
                </li>

                <li>
                    <a href="#profil">
                        <i class="bx bxs-user"></i>
                        <span class="link-text">Profil</span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- KONTEN UTAMA -->
        <section class="home-section">
            <main>

                <section class="content-section">

                    <!-- JUDUL DAN TOMBOL TAMBAH -->
                    <div class="section-heading">
                        <div>
                            <h2>Katalog Perlengkapan</h2>
                        </div>

                        <a href="katalog-entry.html" class="btn-primary">
                            <i class="bx bx-plus"></i>
                            Tambah Data
                        </a>
                    </div>

                    <!-- TABEL KATALOG -->
                    <div class="table-wrapper">
                        <table class="table-data">
                            <thead>
                                <tr>
                                    <th>Foto</th>
                                    <th>Nama Perlengkapan</th>
                                    <th>Deskripsi</th>
                                    <th>Harga / Hari</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>

                            <tbody id="katalogTable">
                                <!-- Data katalog ditampilkan melalui JavaScript -->
                            </tbody>
                        </table>
                    </div>

                </section>

            </main>

            <!-- FOOTER -->
            <footer id="profil">
                <a href="../dashboard.html" class="footer-logo">
                    Adventure<span>Aja</span>
                </a>

                <p>Temani setiap langkah petualanganmu.</p>

                <span class="copyright">© AdventureAja 2026</span>
            </footer>
        </section>

        <!-- TOAST / SNACKBAR -->
        <div id="toast" class="toast">
            <i class="bx bx-check-circle"></i>
            <span id="toastMessage">Berhasil!</span>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <!-- Setiap file dipanggil satu kali -->
    <script src="../js/script.js"></script>
    <script src="../js/katalog.js"></script>
    <script src="../js/toast.js"></script>

</body>
</html>
