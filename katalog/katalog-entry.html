<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../assets/AdventureAja.png" />
    <title>AdventureAja | Tambah Produk</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="stylesheet" href="../css/crud.css" />
  </head>
  <body>
    <div class="page">
      <!-- NAVBAR -->
      <header class="navbar">
        <div class="logo">
          <img src="../assets/AdventureAja.png" alt="AdventureAja" class="logo-img" />
        </div>
        <input type="checkbox" id="menu-toggle" />
        <label for="menu-toggle" class="menu-btn">&#9776;</label>
        <nav>
          <a href="../index.html">Home</a>
          <a href="katalog.html" class="active">Katalog</a>
          <a href="../login.html">Masuk</a>
          <a href="../register.html">Daftar</a>
        </nav>
      </header>

      <main>
        <section class="section">
          <div class="form-card">
            <h2>Tambah Produk</h2>

            <form action="katalog.html" method="post" enctype="multipart/form-data">
              <label for="nama">Nama Produk</label>
              <input type="text" id="nama" name="nama" placeholder="Contoh: Tenda 3 Layer" />

              <label for="harga">Harga / Hari</label>
              <input type="number" id="harga" name="harga" placeholder="Contoh: 40000" />

              <label for="rating">Rating</label>
              <input type="number" id="rating" name="rating" step="0.1" min="0" max="5" placeholder="Contoh: 4.8" />

              <label for="deskripsi">Deskripsi</label>
              <textarea id="deskripsi" name="deskripsi" rows="4" placeholder="Tuliskan deskripsi produk"></textarea>

              <label for="foto">Foto Produk</label>
              <input type="file" id="foto" name="foto" accept="image/*" />

              <div class="form-actions">
                <a href="katalog.html" class="btn-cancel">Batal</a>
                <button type="submit" class="btn-primary">Simpan</button>
              </div>
            </form>
          </div>
        </section>
      </main>

      <footer>
        <p>&copy; AdventureAja 2026</p>
      </footer>
    </div>
  </body>
</html>
