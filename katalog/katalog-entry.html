<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdventureAja | Tambah Katalog</title>
    <link rel="icon" href="../assets/AdventureAja.png">
    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

    <div class="page">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="logo-details">
                <span class="logo_name">Adventure<span class="logo-accent">Aja</span></span>
                <i class="bx bx-menu toggle-btn" id="sidebarToggle"></i>
            </div>
            <ul class="nav-links">
                <li><a href="../dashboard.html"><i class="bx bxs-home"></i> <span class="link-text">Home</span></a></li>
                <li><a href="katalog.html" class="active"><i class="bx bxs-box"></i> <span class="link-text">Katalog</span></a></li>
                <li><a href="../pesanan/pesanan.html"><i class="bx bxs-receipt"></i> <span class="link-text">Pesanan</span></a></li>
                <li><a href="#profil"><i class="bx bxs-user"></i> <span class="link-text">Profil</span></a></li>
            </ul>
        </div>

        <section class="home-section">
            <main>

                <section class="content-section">
                    <div class="section-heading">
                        <div>
                            <h2>Tambah Perlengkapan</h2>
                        </div>
                        <a href="katalog.html" class="view-all">
                            <i class="bx bx-arrow-back"></i> Kembali
                        </a>
                    </div>

                    <div class="form-card">
                        <form action="">
                            <label for="nama">Nama Perlengkapan</label>
                            <input class="input-field" type="text" id="nama" name="nama" placeholder="Contoh: Tenda 3 Layer"  />

                            <label for="deskripsi">Deskripsi</label>
                            <input class="input-field" type="text" id="deskripsi" name="deskripsi" placeholder="Contoh: Perlengkapan tenda camping" />

                            <label for="harga">Harga per Hari (Rp)</label>
                            <input class="input-field" type="number" id="harga" name="harga" placeholder="Contoh: 40000"  min="0" />

                            <label for="foto">Foto Perlengkapan</label>
                            <input class="input-field" type="file" id="foto" name="foto"     />

                            <button type="submit" class="btn-primary btn-full">
                                <i class="bx bx-save"></i> Simpan Data
                            </button>
                        </form>
                    </div>
                </section>

            </main>

            <footer id="profil">
                <a href="../dashboard.html" class="footer-logo">Adventure<span>Aja</span></a>
                <p>Temani setiap langkah petualanganmu.</p>
                <span class="copyright">© AdventureAja 2026</span>
            </footer>
        </section>

    </div>

    <script src="../js/script.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/katalog.js"></script>
</body>
</html>
